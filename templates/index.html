<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&W Image Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Search</h1>
            <form id="search-form">
                <!-- Search bar -->
                <div class="search-bar">
                    <input type="text" id="search-input" name="query" placeholder="Search for images..." required autocomplete="off">
                    <button type="submit" id="search-btn">Search</button>
                </div>

                <!-- Method selector segmented control -->
                <div class="method-selector">
                    <label class="method-option">
                        <input type="radio" name="method" value="ddgs">
                        <span>DuckDuckGo</span>
                    </label>
                    <label class="method-option">
                        <input type="radio" name="method" value="pinterest">
                        <span>Pinterest</span>
                    </label>
                    <label class="method-option">
                        <input type="radio" name="method" value="mix" checked>
                        <span>Mix</span>
                    </label>
                </div>
            </form>
        </header>
        
        <main>
            <!-- Sleek Loading State -->
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Searching the Web...</p>
            </div>

            <!-- Empty State / No Results -->
            <p id="no-results" class="no-results hidden">No images found. Try adjusting your query.</p>

            <!-- Results Section -->
            <div id="results-section" class="hidden">
                <div class="results-meta">
                    <p id="results-info">PAGE 1</p>
                    <p class="keyboard-hint">Use <span>←</span> and <span>→</span> arrow keys to navigate</p>
                </div>

                <div class="image-grid" id="image-grid"></div>

                <!-- Pagination Controls -->
                <div class="pagination" id="pagination-controls">
                    <button id="prev-btn" onclick="navigatePage(-1)">← Prev</button>
                    <span id="page-indicator">Page 1</span>
                    <button id="next-btn" onclick="navigatePage(1)">Next →</button>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast">URL Copied to Clipboard!</div>

    <script>
        const pageCache = {}; // Local memory storage for loaded pages
        let currentPage = 1;
        let currentQuery = '';
        let currentMethod = 'mix';
        let isLoading = false;

        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const loadingDiv = document.getElementById('loading');
        const resultsSection = document.getElementById('results-section');
        const imageGrid = document.getElementById('image-grid');
        const noResults = document.getElementById('no-results');
        const pageIndicator = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const resultsInfo = document.getElementById('results-info');

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isLoading) return;

            currentQuery = searchInput.value.trim();
            currentMethod = document.querySelector('input[name="method"]:checked').value;
            
            if (!currentQuery) return;

            // Wipe cache and start from page 1 on fresh search
            currentPage = 1;
            for (let key in pageCache) delete pageCache[key];

            fetchPage(currentQuery, currentMethod, currentPage);
        });

        async function fetchPage(query, method, page) {
            isLoading = true;
            showLoading(true);
            noResults.classList.add('hidden');

            // Serve directly from local RAM cache if available (instant undo)
            if (pageCache[page]) {
                renderPage(pageCache[page], page);
                showLoading(false);
                isLoading = false;
                return;
            }

            try {
                const response = await fetch(`/api/search?query=${encodeURIComponent(query)}&method=${method}&page=${page}`);
                const data = await response.json();
                
                if (data.images && data.images.length > 0) {
                    pageCache[page] = data.images;
                    renderPage(data.images, page);
                } else {
                    if (page === 1) {
                        resultsSection.classList.add('hidden');
                        noResults.classList.remove('hidden');
                    } else {
                        alert("No more images available on this page.");
                        currentPage = page - 1; // Prevent advancing past end of library
                    }
                }
            } catch (err) {
                console.error("Fetch error: ", err);
                alert("An error occurred. Check your network or server logs.");
            } finally {
                showLoading(false);
                isLoading = false;
            }
        }

        function renderPage(images, page) {
            imageGrid.innerHTML = '';
            resultsSection.classList.remove('hidden');

            images.forEach(imgUrl => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.onclick = () => copyToClipboard(imgUrl);
                
                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = "Search result";
                img.loading = "lazy";
                img.onerror = () => { card.style.display = 'none'; }; // Hide bad links seamlessly
                
                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                overlay.innerHTML = '<span>Copy URL</span>';
                
                card.appendChild(img);
                card.appendChild(overlay);
                imageGrid.appendChild(card);
            });

            // Refresh UI status
            pageIndicator.innerText = `Page ${page}`;
            resultsInfo.innerText = `PAGE ${page}`;
            prevBtn.disabled = (page === 1);
            nextBtn.disabled = false; // Always permit advancing to next dynamic page
        }

        function navigatePage(direction) {
            if (isLoading) return;
            const newPage = currentPage + direction;
            if (newPage >= 1) {
                currentPage = newPage;
                fetchPage(currentQuery, currentMethod, currentPage);
                // Scroll back to the top of the grid smoothly on page change
                imageGrid.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function showLoading(show) {
            if (show) {
                loadingDiv.classList.remove('hidden');
                if (currentPage === 1) {
                    resultsSection.classList.add('hidden');
                }
            } else {
                loadingDiv.classList.add('hidden');
            }
        }

        // Global arrow key listeners
        document.addEventListener('keydown', (event) => {
            // Ignore pagination calls if user is currently typing in the input block
            if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                return;
            }
            if (event.key === 'ArrowLeft') {
                navigatePage(-1);
            } else if (event.key === 'ArrowRight') {
                navigatePage(1);
            }
        });

        // Copy functionality
        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { 
                    toast.className = toast.className.replace("show", ""); 
                }, 3000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
